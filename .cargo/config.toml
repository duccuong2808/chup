# Link tĩnh MSVC runtime: chup.exe chạy được trên máy chưa cài VC++ Redistributable
# (không có thì Windows báo thiếu VCRUNTIME140.dll ngay khi mở).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[workspace]
members = ["crates/core", "crates/ui", "crates/app", "crates/ocr-proto"]
# Cần Tesseract để link: build riêng (CI Windows, hoặc Homebrew trên macOS), xem crates/ocr-helper.
exclude = ["crates/ocr-helper"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

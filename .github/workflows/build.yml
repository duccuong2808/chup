# CI/CD cho Chup (Win32 native, không WebView).
# - Mỗi lần push / PR: test + clippy trên Windows, build bản release, đóng gói installer NSIS.
#   Installer và file exe được đính kèm vào run dưới dạng artifact.
# - Push tag dạng v* (vd: v0.2.0): tạo thêm GitHub Release (draft) kèm installer.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test + clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    permissions:
      contents: write # cần để tạo Release khi push tag
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release -p chup

      - name: Đóng gói NSIS
        shell: pwsh
        run: |
          $version = ((cargo pkgid -p chup) -replace '.*[#@]', '')
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress | Out-Null
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = "$PWD\dist\Chup_${version}_x64-setup.exe"
          & $makensis /V2 "/DVERSION=$version" "/DEXE=$PWD\target\release\chup.exe" "/DOUTFILE=$out" installer\chup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\chup.exe dist\chup.exe
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: chup-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Tạo GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*-setup.exe

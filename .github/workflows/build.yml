# CI/CD cho Chup.
# - Mỗi lần push / PR: kiểm tra (test + clippy) và build installer NSIS cho Windows,
#   installer được đính kèm vào run dưới dạng artifact.
# - Push tag dạng v* (vd: v0.1.0): tạo thêm GitHub Release (draft) kèm installer.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test + clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tsc --noEmit + vite build; tạo luôn dist/ mà tauri::generate_context! cần khi compile
      - run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    permissions:
      contents: write # cần để tạo Release khi push tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # beforeBuildCommand (npm run build) chạy tự động trong bước này
      - run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: chup-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Tạo GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe

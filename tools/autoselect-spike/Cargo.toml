[package]
name = "autoselect-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike SPEC 16.6 (beads chup-pwn.1): đo liệt kê cửa sổ và UI Automation"

# Không thuộc workspace của Chup: chỉ build trên Windows, chạy tay khi spike.
[workspace]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

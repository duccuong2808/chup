# CI/CD cho Chup (Win32 native, không WebView).
# - Mỗi PR và mỗi lần push lên main: test + clippy trên Windows, build bản release, đóng gói 2 installer NSIS:
#   Full (có sẵn OCR tiếng Việt) và Lite (chỉ chup.exe, OCR tiếng Việt tải khi cần). Đính kèm vào run làm artifact.
# - Nhánh khác chỉ chạy qua PR (trước đây push nhánh + PR chạy 2 lần cho cùng commit). Nhánh chưa có PR mà cần
#   build: tab Actions > Build > Run workflow, chọn nhánh.
# - Push tag dạng v* (vd: v0.2.0): tạo thêm GitHub Release (draft) kèm 2 installer.
# - Commit chỉ đổi tài liệu (*.md, docs/), beads, .claude/, tools/ (spike, ngoài workspace) thì không chạy.
#   Tag v* luôn chạy (GitHub không xét paths với tag). Cần chạy tay: tab Actions > Build > Run workflow.
# - OCR tiếng Việt = engine chup-ocr.exe + dữ liệu tessdata_fast, ghim trong crates/core/src/ocr/manifest.json.
#   Engine phát hành tay ở Release ocr-engine-vN của repo này (README, mục "Phát hành engine OCR"); job ocr-helper
#   chỉ build + test engine từ mã nguồn và để lại artifact `chup-ocr` cho lần phát hành sau. Bản Full lấy đúng
#   file trong manifest (installer/fetch-ocr.ps1, kiểm SHA-256), không lấy bản vừa build.
name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".beads/**"
      - ".claude/**"
      - "tools/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".beads/**"
      - ".claude/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test + clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ocr-helper:
    name: Build chup-ocr.exe (Tesseract, Windows)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ocr-helper

      - name: Version vcpkg (khoá cache)
        id: vcpkg
        shell: pwsh
        run: echo "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      # Tách restore/save: lưu cache ngay sau khi vcpkg cài xong, kể cả khi bước build sau đó lỗi
      # (build Tesseract và các thư viện từ mã nguồn mất ~20 phút).
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: vcpkg-cache
          key: vcpkg-tesseract-x64-windows-static-${{ steps.vcpkg.outputs.commit }}
          restore-keys: vcpkg-tesseract-x64-windows-static-

      - name: vcpkg install tesseract (static)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install tesseract:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/cache/save@v6
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: vcpkg-cache
          key: vcpkg-tesseract-x64-windows-static-${{ steps.vcpkg.outputs.commit }}

      - name: Build + test chup-ocr.exe
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          # Dữ liệu cho test tích hợp: đúng file ghim trong manifest.
          & installer\fetch-ocr.ps1 -Pack data -Out tessdata
          $env:CHUP_TESSDATA = "$PWD\tessdata"
          cargo test --release --manifest-path crates/ocr-helper/Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --manifest-path crates/ocr-helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gom exe + license
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ocr-dist | Out-Null
          Copy-Item crates\ocr-helper\target\release\chup-ocr.exe ocr-dist\
          & ocr-dist\chup-ocr.exe --version
          # Phải là exe tự chứa: chỉ được phụ thuộc DLL của Windows (runner có VC redist nên chạy thử không bắt được).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents ocr-dist\chup-ocr.exe | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
          Write-Host "DLL phụ thuộc: $($deps -join ', ')"
          $bad = $deps | Where-Object { $_ -match '(?i)^(vcruntime|msvcp|vcomp|libcurl|tesseract|leptonica|zlib|libpng|jpeg|tiff|webp|gif|openjp|archive)' }
          if ($bad) { Write-Error "chup-ocr.exe phụ thuộc DLL không có sẵn trên Windows: $($bad -join ', ')"; exit 1 }
          # License của Tesseract và mọi thư viện link tĩnh (lấy từ vcpkg).
          $share = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\share"
          $notice = "chup-ocr.exe link tĩnh các thư viện mã nguồn mở dưới đây. Dữ liệu vie/eng.traineddata`r`n" +
                    "tải riêng từ https://github.com/tesseract-ocr/tessdata_fast (Apache-2.0).`r`n"
          foreach ($c in Get-ChildItem $share -Recurse -Filter copyright | Sort-Object FullName) {
            $notice += "`r`n===== $($c.Directory.Name) =====`r`n" + (Get-Content $c.FullName -Raw)
          }
          Set-Content -Path ocr-dist\NOTICE-ocr.txt -Value $notice -Encoding utf8
          Get-ChildItem ocr-dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: chup-ocr
          path: ocr-dist/*
          if-no-files-found: error

  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    permissions:
      contents: write # cần để tạo Release khi push tag
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release -p chup

      - name: Lấy engine + dữ liệu OCR theo manifest
        id: ocr
        shell: pwsh
        run: |
          & installer\fetch-ocr.ps1 -Pack engine -Out ocr-dist | Out-Null
          $pack = & installer\fetch-ocr.ps1 -Pack data -Out ocr-data | Select-Object -Last 1
          echo "data_pack=$pack" >> $env:GITHUB_OUTPUT

      - name: Đóng gói NSIS (Full + Lite)
        shell: pwsh
        run: |
          $version = ((cargo pkgid -p chup) -replace '.*[#@]', '')
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress | Out-Null
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "$PWD\target\release\chup.exe"
          & $makensis /V2 "/DVERSION=$version" "/DEXE=$exe" "/DOCR_DIR=$PWD\ocr-dist" "/DDATA_DIR=$PWD\ocr-data" `
            "/DDATA_PACK=${{ steps.ocr.outputs.data_pack }}" "/DOUTFILE=$PWD\dist\Chup_${version}_x64-setup.exe" installer\chup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makensis /V2 /DLITE "/DVERSION=$version" "/DEXE=$exe" "/DOUTFILE=$PWD\dist\Chup_${version}_x64-setup-lite.exe" installer\chup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $exe dist\chup.exe
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: chup-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Tạo GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*-setup*.exe

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chup — Cài đặt</title>
  </head>
  <body>
    <main>
      <h1>Cài đặt</h1>

      <section>
        <h2>Lưu ảnh</h2>
        <div class="field">
          <label>Folder lưu ảnh</label>
          <div class="row">
            <code id="saveDir" class="path"></code>
          </div>
          <div class="row">
            <button id="pickDir" class="btn">Chọn folder…</button>
            <button id="openDir" class="btn ghost">Mở folder</button>
          </div>
        </div>
        <div class="field">
          <label for="pattern">Tên file</label>
          <input id="pattern" type="text" spellcheck="false" autocomplete="off" />
          <p class="hint">
            Phần trong <code>{ }</code> là ngày giờ: <code>yyyy MM dd HH mm ss SSS</code>.
            Ví dụ: <code id="preview"></code>
          </p>
        </div>
      </section>

      <section>
        <h2>Phím tắt</h2>
        <div class="field">
          <label for="hk-selectRegion">Chọn vùng</label>
          <input id="hk-selectRegion" class="hotkey" data-name="selectRegion" readonly />
          <p class="error" data-error="selectRegion" hidden></p>
        </div>
        <div class="field">
          <label for="hk-capture">Chụp vùng hiện tại / vùng cuối</label>
          <input id="hk-capture" class="hotkey" data-name="capture" readonly />
          <p class="error" data-error="capture" hidden></p>
        </div>
        <p class="hint">Bấm vào ô rồi nhấn tổ hợp phím. Delete để tắt phím tắt, Esc để huỷ.</p>
      </section>

      <section>
        <h2>Sau khi chụp</h2>
        <label class="check"><input id="copyToClipboard" type="checkbox" /> Copy ảnh vào clipboard</label>
        <div class="field">
          <label for="afterCaptureNormal">Vùng chọn ở chế độ thường</label>
          <select id="afterCaptureNormal">
            <option value="close">Đóng vùng chọn</option>
            <option value="keep">Giữ vùng chọn để chụp tiếp</option>
          </select>
          <p class="hint">Ở chế độ Mờ, vùng chọn luôn được giữ.</p>
        </div>
      </section>

      <section>
        <h2>Stack ảnh</h2>
        <div class="grid2">
          <div class="field">
            <label for="stackEdge">Cạnh màn hình</label>
            <select id="stackEdge">
              <option value="right">Phải</option>
              <option value="left">Trái</option>
            </select>
          </div>
          <div class="field">
            <label for="stackMonitor">Màn hình</label>
            <select id="stackMonitor">
              <option value="primary">Màn hình chính</option>
              <option value="cursor">Màn hình đang có con trỏ</option>
            </select>
          </div>
        </div>
      </section>

      <section>
        <h2>Hệ thống</h2>
        <label class="check"><input id="launchAtStartup" type="checkbox" /> Khởi động cùng Windows</label>
        <label class="check">
          <input id="hideUiDuringCapture" type="checkbox" /> Ẩn toolbar và stack trong lúc chụp
        </label>
        <p class="hint" id="exclusionNote"></p>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

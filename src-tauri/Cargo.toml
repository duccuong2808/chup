[package]
name = "chup"
version = "0.1.0"
description = "Chup — chụp màn hình theo vùng, stack thumbnail kéo thả"
edition = "2021"
rust-version = "1.80"

[lib]
name = "chup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-drag = "=2.1.1"
xcap = "=0.9.8"
arboard = "=3.7.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "3"
base64 = "0.22"
log = "0.4"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "chup"
description = "Chup: chụp màn hình theo vùng, stack thumbnail kéo thả"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "chup"
path = "src/main.rs"

[dependencies]
chup-core = { path = "../core" }
chup-ui = { path = "../ui" }
chup-ocr-proto = { path = "../ocr-proto" }
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# Dùng chung cho Windows và macOS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "=0.8.0"
tray-icon = { version = "=0.25.1", default-features = false }
drag = "=2.1.1"
raw-window-handle = "0.6"

# macOS (SPEC 11, thiết kế docs/plans/2026-11-05-macos-design.md): AppKit + CoreGraphics/CoreText + ScreenCaptureKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-text = "=0.3.2"
objc2-quartz-core = "=0.3.2"
objc2-screen-capture-kit = "=0.3.2"
objc2-service-management = "=0.3.2"
objc2-vision = "=0.3.2"
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
# Keychain cho userhash catbox (SPEC 19).
security-framework = "=3.7.0"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-numerics = "=0.3.1"
windows = { version = "=0.62.2", features = [
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Foundation_Collections",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Networking_WinHttp",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "=1.5.1"
embed-resource = "=3.0.12"

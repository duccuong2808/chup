[package]
name = "share-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike SPEC 19.4 (beads chup-share.1): upload Litterbox, PrivateBin v2"

# Không thuộc workspace của Chup: chạy tay khi spike. HTTP gọi /usr/bin/curl.
[workspace]

[dependencies]
aes-gcm = "=0.11.1"
aes = "=0.9.4"
pbkdf2 = "=0.13.0"
sha2 = "=0.11.1"
bs58 = "=0.5.1"
base64 = "=0.23.1"
flate2 = "=1.1.10"
getrandom = "=0.4.3"
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
